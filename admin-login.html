<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bite Amit Restaurant | Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- ==========================================================
     HEADER

     PURPOSE:
     Displays restaurant title.
     ========================================================== -->

<header>

    <!-- START: Clickable Restaurant Header Link -->
    <h1>
        <!-- This link ensures that clicking the header refreshes or stays on the homepage -->
        <a href="index.html" class="header-logo-link">🍽️ Vicky's Restaurant</a>
    </h1>
    <!-- END: Clickable Restaurant Header Link -->


</header>



<!-- ==========================================================
     ADMIN LOGIN FORM

     PURPOSE:
     Allows restaurant administrator to login.
     ========================================================== -->

<main>

    <h2>Admin Login</h2>

    <div id="admin-login">

        <label>

            Username

        </label>

        <br>

        <input

            type="text"

            id="username"

            placeholder="Enter Username"

        >

        <br><br>


        <label>

            Password

        </label>

        <br>


        <input
                
            type="password"
                
            id="password"
                
            placeholder="Enter Password"
                
            onkeypress="handleAdminLogin(event)"
                
        >
        
        
        <p class="password-hint">
        
        Password must contain:
        <br>
        • Minimum 10 characters
        <br>
        • One uppercase letter
        <br>
        • One lowercase letter
        <br>
        • One number
        <br>
        • One special character
        
        </p>

        <br><br>


        <button onclick="adminLogin()">
        
            Login
        
        </button>
        
        
        <br><br>
        
        
        <a href="#" onclick="forgotPassword()" class="forgot-password">
        
            Forgot Password?
        
        </a>

    </div>

</main>



<!-- ==========================================================
     JAVASCRIPT

     PURPOSE:
     Loads admin login functionality.
     ========================================================== -->

<script src="admin.js"></script>

</body>

</html>
