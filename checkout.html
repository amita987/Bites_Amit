<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bite Amit Restaurant | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<!-- START: Clickable Restaurant Header Link -->
<h1>
    <!-- This link ensures that clicking the header refreshes or stays on the homepage -->
    <a href="index.html" class="header-logo-link">🍽️ Vicky's Restaurant</a>
</h1>
<!-- END: Clickable Restaurant Header Link -->



<nav>


<!-- ==========================================================
     WEBSITE NAVIGATION

     PURPOSE:
     Navigation for Customer and Administrator.
     ========================================================== -->

<a href="index.html">

Home

</a>


<a href="menu.html">

Menu

</a>


<a href="cart.html">

🛒 Cart

<span id="cart-count">(0)</span>

</a>


<a href="admin-login.html">

🔐 Admin Login

</a>


</nav>


</header>



<main>


<h2>
Checkout
</h2>


<div id="checkout-container">
<div id="order-summary">

<h3>Your Order</h3>

<div id="checkout-items">

</div>


<hr>


<p>
Subtotal:
₹<span id="checkout-subtotal">0</span>
</p>


<!-- ==========================================================
     DELIVERY CHARGE

     PURPOSE:
     Displays the delivery charge selected by the admin.

========================================================== -->

<p>

Delivery:

₹<span id="checkout-delivery">0</span>

</p>



<!-- ==========================================================
     TAX

     PURPOSE:
     Displays the restaurant tax that the customer
     will pay.

========================================================== -->

<p>

Tax (

<span id="checkout-tax-percentage">0</span>

%):

₹<span id="checkout-tax">0</span>

</p>



<!-- ==========================================================
     GRAND TOTAL

     PURPOSE:
     Displays the final amount payable.

     Formula:

     Subtotal
     + Delivery
     + Tax

========================================================== -->

<h3>

Grand Total:

₹<span id="checkout-total">0</span>

</h3>


<p id="saved-row">

🎉 You saved
₹<span id="checkout-discount">0</span>
today!

</p>

     

<hr>

</div>

<h3>
Customer Details
</h3>


<label>
Full Name
</label>

<br>

<input 
type="text"
id="customer-name"
placeholder="Enter your name">


<br><br>

<!-- ==========================================================
     PICKUP / SERVE TIME

     PURPOSE:
     Lets the customer choose when they want
     their food served, picked up or delivered.

========================================================== -->

<h3>
Pickup / Serve Time
</h3>

<!-- ==========================================================
     PICKUP / SERVE DATE

     PURPOSE:
     Customer selects the required date.

========================================================== -->

<label for="pickup-date">

Pickup / Serve Date

</label>

<br>

<input
type="date"
id="pickup-date">

<br><br>

<!-- ==========================================================
     PICKUP / SERVE TIME

     PURPOSE:
     Customer selects the required time in
     12-hour AM/PM format.

========================================================== -->

<label for="pickup-time">

Pickup / Serve Time

</label>

<br>

<select id="pickup-time">

</select>

<br><br>

<label>
Mobile Number
</label>

<br>

<input
type="tel"
id="mobile"
placeholder="Enter mobile number"
inputmode="numeric"
autocomplete="tel">
    
<div id="mobile-error" class="validation-error"></div>


<br><br>



<label>
Email
</label>

<br>

<input 
type="email"
id="email"
placeholder="Enter email">


<br><br>



<h3>
Delivery Address
</h3>


<textarea

id="address"

placeholder="Enter complete address">

</textarea>



<br><br>



<h3>
Payment Method
</h3>


<label>

<input 
type="radio"
name="payment"
value="Cash on Delivery"
checked>

Cash on Delivery

</label>


<br>


<label>

<input 
type="radio"
name="payment"
value="Online Payment">

Online Payment

</label>



<br><br>


<button onclick="placeOrder()">

Place Order

</button>

<button onclick="backToCheckout()">

⬅ Back to Checkout

</button>


</div>


</main>



<footer>

<p>
© 2026 Bite Amit Restaurant
</p>

</footer>


<script src="cart.js"></script>
<script src="checkout.js"></script>


</body>

</html>
